  function initMusicOnce() {
        if (!window.initializedTouchEventForMusic) {
            window.initializedTouchEventForMusic = true;
            try {
                window.musicInstance = new Howl({
                      src: [window.musicGamePath],
                      loop: true,
                      volume: 0.777

            }

         if(v)

  window.PlayBackgroundMusic = function() {
           if(window.AdOnScreen)

           if(!window.musicState)

           try {

    if(!window.launchedMusicInHandle) {
